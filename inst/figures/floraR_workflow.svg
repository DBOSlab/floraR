<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 900" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2F6D3B"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1180" height="900" fill="#F5F9F3"/>

  <!-- Title -->
  <text x="40" y="42" font-size="24" font-weight="700" fill="#1F4D2B">floraR workflow</text>
  <text x="40" y="64" font-size="13" fill="#4A6B50">Access and analyze Flora e Funga do Brasil data, then help taxonomists expand its monographs</text>

  <!-- Stages 1-3 sit horizontally centered above the full-width Stage 4 band,
       with their headers in the left margin, level with their boxes, so the
       connectors between stages never cross header text. -->

  <!-- ============ STAGE 1: Access &amp; parse ============ -->
  <text x="40" y="137" font-size="14" font-weight="700" fill="#2F6D3B">1. ACCESS &amp; PARSE</text>

  <g font-size="13.5">
    <rect x="265" y="114" width="190" height="52" rx="10" fill="#EEF6EC" stroke="#6FA876" stroke-width="1.5"/>
    <text x="360" y="145" text-anchor="middle" fill="#1F4D2B" font-weight="600">flora_version()</text>

    <rect x="495" y="114" width="190" height="52" rx="10" fill="#EEF6EC" stroke="#6FA876" stroke-width="1.5"/>
    <text x="590" y="145" text-anchor="middle" fill="#1F4D2B" font-weight="600">flora_download()</text>

    <rect x="725" y="114" width="190" height="52" rx="10" fill="#EEF6EC" stroke="#6FA876" stroke-width="1.5"/>
    <text x="820" y="145" text-anchor="middle" fill="#1F4D2B" font-weight="600">flora_parse()</text>
  </g>

  <line x1="455" y1="140" x2="491" y2="140" stroke="#2F6D3B" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="685" y1="140" x2="721" y2="140" stroke="#2F6D3B" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- connector: stage 1 -> stage 2 -->
  <path d="M820,166 L820,222 L380,222 L380,224" fill="none" stroke="#2F6D3B" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M820,166 L820,222 L660,222 L660,224" fill="none" stroke="#2F6D3B" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- ============ STAGE 2: Explore &amp; filter ============ -->
  <text font-size="14" font-weight="700" fill="#2F6D3B">
    <tspan x="40" y="252">2. EXPLORE &amp; FILTER</tspan>
    <tspan x="40" y="270">THE CHECKLIST</tspan>
  </text>

  <g font-size="13.5">
    <rect x="265" y="228" width="230" height="58" rx="10" fill="#EEF6EC" stroke="#6FA876" stroke-width="1.5"/>
    <text x="380" y="254" text-anchor="middle" fill="#1F4D2B" font-weight="600">flora_records()</text>
    <text x="380" y="272" text-anchor="middle" fill="#5E7F63" font-size="11">taxon / state / domain / lifeForm</text>

    <rect x="535" y="228" width="250" height="58" rx="10" fill="#EEF6EC" stroke="#6FA876" stroke-width="1.5"/>
    <text x="660" y="254" text-anchor="middle" fill="#1F4D2B" font-weight="600">flora_get_children_taxa()</text>
    <text x="660" y="272" text-anchor="middle" fill="#5E7F63" font-size="11">class / order / family / genus</text>
  </g>

  <!-- connector: stage 2 -> stage 3 -->
  <path d="M660,286 L660,344 L360,344 L360,346" fill="none" stroke="#2F6D3B" stroke-width="2" stroke-dasharray="5 3" marker-end="url(#arrow)"/>

  <!-- ============ STAGE 3: Resolve your own names ============ -->
  <text font-size="14" font-weight="700" fill="#2F6D3B">
    <tspan x="40" y="372">3. RESOLVE YOUR</tspan>
    <tspan x="40" y="390">OWN NAME LIST</tspan>
  </text>

  <g font-size="13.5">
    <rect x="265" y="350" width="190" height="52" rx="10" fill="#EEF6EC" stroke="#6FA876" stroke-width="1.5"/>
    <text x="360" y="381" text-anchor="middle" fill="#1F4D2B" font-weight="600">flora_search()</text>

    <rect x="495" y="350" width="190" height="52" rx="10" fill="#EEF6EC" stroke="#6FA876" stroke-width="1.5"/>
    <text x="590" y="381" text-anchor="middle" fill="#1F4D2B" font-weight="600">flora_match()</text>
  </g>

  <line x1="455" y1="376" x2="491" y2="376" stroke="#2F6D3B" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- ============ STAGE 4: Expand FFB monographs (highlighted, full width) ============ -->
  <!-- A wide band grouped into three sub-columns by the kind of gap each tool
       fills, converging into a single review box. No connector is drawn from
       stages 1-3: every function here takes a taxon name directly, so it never
       requires running Steps 1-3 first. -->
  <rect x="40" y="430" width="1100" height="358" rx="16" fill="#DCEFD8" stroke="#2F6D3B" stroke-width="2.5"/>
  <text x="60" y="460" font-size="14" font-weight="700" fill="#1F4D2B">4. EXPAND FFB MONOGRAPHS</text>
  <text x="60" y="478" font-size="11" fill="#1F4D2B">for taxonomic experts contributing to the platform &#8212; takes a taxon name directly, no Steps 1-3 required</text>

  <g font-size="12" font-weight="700" fill="#1F4D2B">
    <text x="230" y="502" text-anchor="middle">SPECIES MISSING FROM FFB</text>
    <text x="590" y="502" text-anchor="middle">NEW STATE RECORDS</text>
    <text x="950" y="502" text-anchor="middle">TAXON DESCRIPTIONS</text>
  </g>

  <g font-size="13">
    <!-- Missing species column (one taller box) -->
    <rect x="60" y="514" width="340" height="164" rx="10" fill="#FFFFFF" stroke="#2F6D3B" stroke-width="1.5"/>
    <text x="230" y="552" text-anchor="middle" fill="#1F4D2B" font-weight="600">flora_species_gap()</text>
    <text x="230" y="576" text-anchor="middle" fill="#4A6B50" font-size="10.5">Species recorded in Brazil that are</text>
    <text x="230" y="592" text-anchor="middle" fill="#4A6B50" font-size="10.5">still missing from FFB, from</text>
    <text x="230" y="608" text-anchor="middle" fill="#4A6B50" font-size="10.5">POWO distributions and/or</text>
    <text x="230" y="624" text-anchor="middle" fill="#4A6B50" font-size="10.5">Brazilian type specimens (GBIF)</text>

    <!-- New state records column (one taller box) -->
    <rect x="420" y="514" width="340" height="164" rx="10" fill="#FFFFFF" stroke="#2F6D3B" stroke-width="1.5"/>
    <text x="590" y="552" text-anchor="middle" fill="#1F4D2B" font-weight="600">flora_distribution_gap()</text>
    <text x="590" y="576" text-anchor="middle" fill="#4A6B50" font-size="10.5">Brazilian states with specimen evidence</text>
    <text x="590" y="592" text-anchor="middle" fill="#4A6B50" font-size="10.5">(GBIF / REFLORA / speciesLink)</text>
    <text x="590" y="608" text-anchor="middle" fill="#4A6B50" font-size="10.5">absent from FFB's official</text>
    <text x="590" y="624" text-anchor="middle" fill="#4A6B50" font-size="10.5">distribution for that taxon</text>

    <!-- Descriptions column -->
    <rect x="780" y="514" width="340" height="76" rx="10" fill="#FFFFFF" stroke="#2F6D3B" stroke-width="1.5"/>
    <text x="950" y="539" text-anchor="middle" fill="#1F4D2B" font-weight="600">flora_get_descriptions()</text>
    <text x="950" y="558" text-anchor="middle" fill="#4A6B50" font-size="10.5">Extract the morphological descriptions</text>
    <text x="950" y="573" text-anchor="middle" fill="#4A6B50" font-size="10.5">of FFB taxon pages</text>

    <rect x="780" y="602" width="340" height="76" rx="10" fill="#FFFFFF" stroke="#2F6D3B" stroke-width="1.5"/>
    <text x="950" y="627" text-anchor="middle" fill="#1F4D2B" font-weight="600">flora_build_matrix()</text>
    <text x="950" y="646" text-anchor="middle" fill="#4A6B50" font-size="10.5">Turn descriptions into a</text>
    <text x="950" y="661" text-anchor="middle" fill="#4A6B50" font-size="10.5">taxon-by-character matrix</text>
  </g>

  <line x1="950" y1="590" x2="950" y2="598" stroke="#2F6D3B" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Review box, fed by all three columns -->
  <rect x="470" y="716" width="240" height="58" rx="10" fill="#2F6D3B"/>
  <text x="590" y="741" text-anchor="middle" fill="#F2FAF0" font-weight="700">Taxonomist review</text>
  <text x="590" y="758" text-anchor="middle" fill="#F2FAF0" font-size="11">&#8594; expanded FFB monographs</text>

  <path d="M230,678 L230,698 L530,698 L530,712" fill="none" stroke="#2F6D3B" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="590" y1="678" x2="590" y2="712" stroke="#2F6D3B" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M950,678 L950,698 L650,698 L650,712" fill="none" stroke="#2F6D3B" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Footer: legend + note, well below every box -->
  <g font-size="11.5" fill="#4A6B50">
    <rect x="40" y="818" width="14" height="14" fill="#EEF6EC" stroke="#6FA876"/>
    <text x="60" y="829">Access, explore, and resolve names (Steps 1-3)</text>
    <rect x="380" y="818" width="14" height="14" fill="#DCEFD8" stroke="#2F6D3B"/>
    <text x="400" y="829">Curation tools to expand FFB monographs (Step 4)</text>
  </g>

  <text x="40" y="860" font-size="12" fill="#5E7F63">Most functions download and parse the FFB dataset automatically and cache it locally,</text>
  <text x="40" y="878" font-size="12" fill="#5E7F63">so flora_download()/flora_parse() rarely need to be called directly.</text>
</svg>
